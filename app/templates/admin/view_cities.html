<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Cities</title>
</head>
<body>
    <h2>All Cities</h2>
    <table>
        <thead>
            <tr>
                <th>City</th>
            </tr>
        </thead>
        <tbody>
            {% for city in cities %}
            <tr>
                <td>{{ city['city'] }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
