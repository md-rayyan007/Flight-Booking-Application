<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Airline</title>
</head>
<body>
    <h2>Add Airline</h2>
    <form method="POST" action="{{ url_for('admin.add_airline_view') }}">
        <label for="airline_id">Airline ID:</label>
        <input type="number" id="airline_id" name="airline_id" required>
        <br>
        <label for="name">Airline Name:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="seats">Number of Seats:</label>
        <input type="number" id="seats" name="seats" required>
        <br>
        <button type="submit">Add Airline</button>
    </form>
</body>
</html>
